[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "transferred"
description = "The most convenient data transfer tool."
readme = "README.md"
license = "MIT"
authors = [{ name = "Vania Livadnyi" }]
requires-python = ">=3.14"
keywords = ["data-transfer", "etl", "arrow", "parquet", "postgres"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]

[project.optional-dependencies]
arrow = ["pyarrow>=24"]
iterable = ["transferred[arrow]"]

[project.urls]
Repository = "https://github.com/skatromb/transferred"

[tool.maturin]
module-name = "transferred._native"
python-source = "python"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "maturin>=1.13",
    "pytest>=9",
    "pyarrow>=24",
    "pyarrow-stubs>=20",
    "pydantic>=2",
    "psutil>=7",
    "ruff>=0.15",
    "ty>=0.0.37",
]
# Baselines the perf suite measures `transferred` against. Kept out of `dev`:
# nothing but `make perf` needs a Postgres driver, a query engine and pandas.
perf = [
    "connectorx>=0.4.5",
    "dlt[filesystem,postgres,sql-database]>=1.30",
    "duckdb>=1.5",
    "fastparquet>=2026.5",
]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
doctest_optionflags = "ELLIPSIS"

[tool.ruff]
extend-exclude = ["python/transferred/_native/__init__.pyi"]
