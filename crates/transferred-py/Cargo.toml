[package]
name = "transferred-py"
description = "Python bindings for the transferred data transfer engine."
readme = "README.md"
keywords = ["transferred", "python", "pyo3", "arrow", "etl"]
categories = ["api-bindings", "database"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[lints]
workspace = true

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
transferred-core = { workspace = true }
transferred-files = { workspace = true }
transferred-postgres = { workspace = true }
arrow = { workspace = true, features = ["pyarrow"] }
pyo3 = { version = "0.29", features = ["experimental-inspect"] }
pyo3-log = "0.13"
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
humansize = "2"
humantime = "2"
thousands = "0.2"
