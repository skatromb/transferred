[package]
name = "transferred-postgres"
description = "Postgres source + destination for the transferred data transfer engine."
readme = "../../README.md"
keywords = ["transferred", "postgres", "arrow", "etl", "data-transfer"]
categories = ["database"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
exclude = ["tests"]

[lints]
workspace = true

[dependencies]
transferred-core = { workspace = true }
arrow = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14", features = ["native-certs", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
postgres-protocol = "0.6"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
pg_interval = "0.6"
rust_decimal = { version = "1", default-features = false, features = ["db-tokio-postgres"] }
serde_json = "1"
uuid = "1"
url = "2.5"

[features]
# Integration tests that spin up a throwaway Postgres container. Needs Docker.
integration = []

[dev-dependencies]
transferred-files = { workspace = true }
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tempfile = "3"
ctor = "1.0"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["integration"]
