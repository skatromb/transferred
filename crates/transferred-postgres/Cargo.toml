[package]
name = "transferred-postgres"
description = "Postgres source for the transferred data transfer engine."
readme = "../../README.md"
keywords = ["transferred", "postgres", "arrow", "etl", "data-transfer"]
categories = ["database"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
exclude = ["tests"]

[lints]
workspace = true

[dependencies]
transferred-core = { workspace = true }
arrow = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
pg_interval = "0.6"
rust_decimal = { version = "1", default-features = false, features = ["db-tokio-postgres"] }
serde_json = { version = "1", features = ["raw_value"] }
uuid = "1"
url = "2.5"

[features]
# Integration tests that spin up a throwaway Postgres container. Needs Docker.
integration = []

[dev-dependencies]
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }

[[test]]
name = "pg_to_arrow"
required-features = ["integration"]
