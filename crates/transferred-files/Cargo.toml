[package]
name = "transferred-files"
description = "Local filesystem source and destination (Parquet and other file formats) for the transferred data transfer engine."
readme = "../../README.md"
keywords = ["transferred", "parquet", "arrow", "etl", "data-transfer"]
categories = ["database", "filesystem"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
transferred-core = { workspace = true }
arrow = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
parquet = { version = "59", features = ["arrow", "async"] }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
glob = "0.3"
tracing = { workspace = true }

[dev-dependencies]
transferred-core = { workspace = true, features = ["dev"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
futures = { workspace = true }
