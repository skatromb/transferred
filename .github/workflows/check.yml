name: Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04-arm
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust: &rust
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'rust-toolchain.toml'
              - 'Makefile'
              - '.github/workflows/check.yml'
            python:
              - *rust
              - 'examples/**'
              - 'perf/**'

  # The only required status check. The jobs below stay optional so the path filter can skip them.
  check-all:
    name: Check all
    needs: [changes, rust, rust-x86_64, python, integration]
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Fail unless every check passed or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          jq -e 'all(.[].result; . == "success" or . == "skipped")' <<<"$NEEDS" >/dev/null

  rust:
    name: Rust (aarch64)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: make rust-check
        run: make rust-check

      - name: make stubs-check
        run: make stubs-check

  rust-x86_64:
    name: Rust (x86_64)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: make cargo-test
        run: make cargo-test

  python:
    name: Python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: make python-check
        run: make python-check

  integration:
    name: Integration
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: make check-integration
        run: make check-integration
