name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Tag is reachable from main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "Tag commit $GITHUB_SHA is not on main"; exit 1; }

      - name: Tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          cargo_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="transferred-core") | .version')
          [ "$tag" = "$cargo_version" ] \
            || { echo "tag $tag != cargo $cargo_version"; exit 1; }

  cargo-publish:
    name: Publish Rust crates
    runs-on: ubuntu-latest
    needs: verify
    environment:
      name: crates-io
      url: https://crates.io/crates/transferred-core
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Publish crates
        run: |
          set -u
          for pkg in transferred-core transferred-files transferred-postgres transferred-py; do
            if ! cargo publish -p "$pkg" 2> /tmp/publish.err; then
              if grep -qE "already (uploaded|exists)" /tmp/publish.err; then
                echo "::notice::$pkg version already on crates.io, skipping"
              else
                cat /tmp/publish.err >&2
                exit 1
              fi
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  wheels:
    name: Build wheels (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: auto }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  manylinux: auto }
          - { os: macos-latest,     target: aarch64-apple-darwin,      manylinux: "" }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    manylinux: "" }
    steps:
      - uses: actions/checkout@v6

      - name: Install Python (3.14 + 3.14t)
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.14
            3.14t

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          working-directory: crates/transferred-py
          args: --release --out dist --find-interpreter

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}
          path: crates/transferred-py/dist/*.whl

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: crates/transferred-py
          args: --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: crates/transferred-py/dist/*.tar.gz

  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [wheels, sdist]
    environment:
      name: pypi
      url: https://pypi.org/project/transferred/
    permissions:
      id-token: write
    steps:
      - name: Download all dist artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{wheels-*,sdist}"
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
