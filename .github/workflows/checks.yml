name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04-arm
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'rust-toolchain.toml'
              - 'Makefile'
              - '.github/workflows/checks.yml'

  # The only required status check. The jobs below stay optional so the path filter can skip them.
  check-all:
    name: Check all
    needs: [changes, rust, python, integration]
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Fail unless every check passed or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          jq -e 'all(.[].result; . == "success" or . == "skipped")' <<<"$NEEDS" >/dev/null

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: make rust-check
        run: make rust-check

      - name: make stubs-check
        run: make stubs-check

  python:
    name: Python
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: make python-check
        run: make python-check

  integration:
    name: Integration
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: make check-integration
        run: make check-integration
