[profile.release]
lto = "thin"

[workspace]
resolver = "3"
members = [
    "crates/transferred-core",
    "crates/transferred-postgres",
    "crates/transferred-files",
    "crates/transferred-py",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/skatromb/transferred"

[workspace.dependencies]
transferred-core = { path = "crates/transferred-core", version = "0.1.4" }
transferred-files = { path = "crates/transferred-files", version = "0.1.4" }
transferred-postgres = { path = "crates/transferred-postgres", version = "0.1.4" }
# Held at the major `geoarrow-schema` releases against; the two move together.
arrow = { version = "59", features = ["prettyprint"] }
arrow-schema = { version = "59", features = ["canonical_extension_types"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
log = "0.4"

[workspace.lints.clippy]
# easy-peasy: Nursery and pedantic
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
redundant_pub_crate = "allow"

# easy-peasy: Cargo
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

# easy-peasy: No panics
arithmetic_side_effects = "deny"
cast_abs_to_unsigned = "deny"
exit = "warn"
expect_used = "deny"
indexing_slicing = "deny"
missing_assert_message = "warn"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "warn"
unwrap_used = "deny"

# easy-peasy: Explicit numbers and casts
as_conversions = "warn"
as_pointer_underscore = "warn"
as_underscore = "warn"
decimal_literal_representation = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
host_endian_bytes = "warn"
integer_division = "warn"
little_endian_bytes = "warn"
lossy_float_literal = "warn"
modulo_arithmetic = "warn"
non_zero_suggestions = "warn"
precedence_bits = "warn"
suspicious_xor_used_as_pow = "warn"

# easy-peasy: Documented unsafe
default_union_representation = "warn"
inline_asm_x86_att_syntax = "warn"
mem_forget = "warn"
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"

# easy-peasy: No debug output
dbg_macro = "warn"
pointer_format = "warn"
print_stderr = "warn"
print_stdout = "warn"
use_debug = "warn"

# easy-peasy: Handled errors
map_err_ignore = "warn"
try_err = "warn"
unused_result_ok = "warn"

# easy-peasy: Naming
disallowed_script_idents = "warn"
error_impl_error = "warn"
min_ident_chars = "warn"
module_name_repetitions = "warn"
redundant_test_prefix = "warn"
renamed_function_params = "warn"
same_name_method = "warn"
shadow_reuse = "warn"
shadow_same = "warn"
shadow_unrelated = "warn"
single_char_lifetime_names = "warn"

# easy-peasy: Modules and imports
absolute_paths = "warn"
alloc_instead_of_core = "warn"
cfg_not_test = "warn"
definition_in_module_root = "warn"
field_scoped_visibility_modifiers = "warn"
inline_modules = "warn"
mod_module_files = "deny"
multiple_inherent_impl = "warn"
partial_pub_fields = "warn"
pub_without_shorthand = "warn"
tests_outside_test_module = "warn"
unnecessary_self_imports = "warn"
unused_trait_names = "warn"

# easy-peasy: Explicit control flow and patterns
cognitive_complexity = "warn"
else_if_without_else = "warn"
infinite_loop = "warn"
mixed_read_write_in_expression = "warn"
ref_patterns = "warn"
rest_pat_in_fully_bound_structs = "warn"
unnecessary_rest_pattern = "warn"
unneeded_field_pattern = "warn"
wildcard_enum_match_arm = "warn"

# easy-peasy: Idiomatic std
create_dir = "warn"
deref_by_slicing = "warn"
filetype_is_file = "warn"
if_then_some_else_none = "warn"
iter_over_hash_type = "warn"
map_with_unused_argument_over_ranges = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
needless_raw_strings = "warn"
pathbuf_init_then_push = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
return_and_then = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_chars_any = "warn"
verbose_file_reads = "warn"

# easy-peasy: Consistent style
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
doc_include_without_cfg = "warn"
doc_paragraphs_missing_punctuation = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
large_include_file = "warn"
redundant_type_annotations = "warn"
semicolon_inside_block = "warn"
unseparated_literal_suffix = "warn"

[workspace.lints.rust]
# easy-peasy: Safety
ffi_unwind_calls = "warn"
raw_borrows_via_references = "warn"
unsafe_code = "deny"

# easy-peasy: Hidden behaviour
ambiguous_negative_literals = "warn"
deref_into_dyn_supertrait = "warn"
let_underscore_drop = "warn"
meta_variable_misuse = "warn"
non_ascii_idents = "warn"
unstable_features = "warn"
unused_results = "warn"
variant_size_differences = "warn"

# easy-peasy: Public API
missing_copy_implementations = "warn"
missing_docs = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"

# easy-peasy: Dead code
closure_returning_async_block = "warn"
explicit_outlives_requirements = "warn"
impl_trait_redundant_captures = "warn"
macro_use_extern_crate = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
