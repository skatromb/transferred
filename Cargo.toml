[profile.release]
lto = "thin"

[workspace]
resolver = "3"
members = [
    "crates/transferred-core",
    "crates/transferred-postgres",
    "crates/transferred-files",
    "crates/transferred-py",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/skatromb/transferred"

[workspace.dependencies]
transferred-core = { path = "crates/transferred-core", version = "0.1.3" }
transferred-files = { path = "crates/transferred-files", version = "0.1.3" }
transferred-postgres = { path = "crates/transferred-postgres", version = "0.1.3" }
# Held at the major `geoarrow-schema` releases against; the two move together.
arrow = { version = "59", features = ["prettyprint"] }
arrow-schema = { version = "59", features = ["canonical_extension_types"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
tracing = { version = "0.1", features = ["log"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
redundant_pub_crate = "allow"

# Don't panic
arithmetic_side_effects = "deny"
cast_abs_to_unsigned = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

# Readable code and best practices from `restriction`
restriction = { level = "warn", priority = -1 }
arbitrary_source_item_ordering = "allow"
assertions_on_result_states = "allow"
big_endian_bytes = "allow"
blanket_clippy_restriction_lints = "allow"
clone_on_ref_ptr = "allow"
default_numeric_fallback = "allow"
float_arithmetic = "allow"
impl_trait_in_params = "allow"
implicit_return = "allow"
inline_trait_bounds = "allow"
integer_division_remainder_used = "allow"
let_underscore_must_use = "allow"
let_underscore_untyped = "allow"
missing_docs_in_private_items = "allow"
missing_inline_in_public_items = "allow"
missing_trait_methods = "allow"
mod_module_files = "deny"
non_ascii_literal = "allow"
pattern_type_mismatch = "allow"
pub_use = "allow"
pub_with_shorthand = "allow"
question_mark_used = "allow"
rest_pattern_accessible_field = "allow"
self_named_module_files = "allow"
separated_literal_suffix = "allow"
shadow_reuse = "allow"
single_call_fn = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
string_add = "allow"

# Relax until the v1.0
exhaustive_enums = "allow"
exhaustive_structs = "allow"

[workspace.lints.rust]
absolute_paths_not_starting_with_crate = "warn"
ambiguous_negative_literals = "warn"
closure_returning_async_block = "warn"
deprecated_in_future = "warn"
deprecated_safe_2024 = "warn"
deref_into_dyn_supertrait = "warn"
edition_2024_expr_fragment_specifier = "warn"
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
ffi_unwind_calls = "warn"
if_let_rescope = "warn"
impl_trait_overcaptures = "warn"
impl_trait_redundant_captures = "warn"
keyword_idents_2018 = "warn"
keyword_idents_2024 = "warn"
let_underscore_drop = "warn"
linker_info = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_docs = "deny"
missing_unsafe_on_extern = "warn"
non_ascii_idents = "warn"
raw_borrows_via_references = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
rust_2021_incompatible_closure_captures = "warn"
rust_2021_incompatible_or_patterns = "warn"
rust_2021_prefixes_incompatible_syntax = "warn"
rust_2021_prelude_collisions = "warn"
rust_2024_guarded_string_incompatible_syntax = "warn"
rust_2024_incompatible_pat = "warn"
rust_2024_prelude_collisions = "warn"
single_use_lifetimes = "warn"
tail_expr_drop_order = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_attr_outside_unsafe = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unstable_features = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_results = "warn"
variant_size_differences = "warn"
