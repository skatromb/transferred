[workspace]
resolver = "3"
members = [
    "crates/transferred-core",
    "crates/transferred-postgres",
    "crates/transferred-files",
    "crates/transferred-py",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/skatromb/transferred"

[workspace.dependencies]
transferred-core = { path = "crates/transferred-core", version = "0.1.3" }
transferred-files = { path = "crates/transferred-files", version = "0.1.3" }
transferred-postgres = { path = "crates/transferred-postgres", version = "0.1.3" }
# Held at the major `geoarrow-schema` releases against; the two move together.
arrow = { version = "59", features = ["prettyprint"] }
arrow-schema = { version = "59", features = ["canonical_extension_types"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
tracing = { version = "0.1", features = ["log"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = {level = "warn", priority = -1 }

# Don't panic
arithmetic_side_effects = "deny"
cast_abs_to_unsigned = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

# Readable code and best practices from `restriction`
restriction = { level = "warn", priority = -1 }
arbitrary_source_item_ordering = "allow"
assertions_on_result_states = "allow"
big_endian_bytes = "allow"
blanket_clippy_restriction_lints = "allow"
clone_on_ref_ptr = "allow"
default_numeric_fallback = "allow"
float_arithmetic = "allow"
impl_trait_in_params = "allow"
implicit_return = "allow"
inline_trait_bounds = "allow"
integer_division_remainder_used = "allow"
let_underscore_must_use = "allow"
let_underscore_untyped = "allow"
missing_docs_in_private_items = "allow"
missing_inline_in_public_items = "allow"
missing_trait_methods = "allow"
mod_module_files = "deny"
non_ascii_literal = "allow"
pattern_type_mismatch = "allow"
pub_use = "allow"
pub_with_shorthand = "allow"
question_mark_used = "allow"
rest_pattern_accessible_field = "allow"
self_named_module_files = "allow"
separated_literal_suffix = "allow"
shadow_reuse = "allow"
single_call_fn = "allow"
std_instead_of_alloc = "allow"
std_instead_of_core = "allow"
string_add = "allow"

# Relax until the v1.0
exhaustive_enums = "allow"
exhaustive_structs = "allow"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[profile.release]
lto = "thin"
